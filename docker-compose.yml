services:
  db:
    image: postgres:18-alpine
    container_name: taskhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskhub_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskhub_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
